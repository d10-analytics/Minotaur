name: typecheck

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  mypy:
    name: "Type check"
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and run mypy
        run: |
          rm -rf .venv
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --upgrade pip
          pip install -e ".[dev]"
          mypy
