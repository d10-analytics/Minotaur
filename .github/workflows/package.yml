name: package

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  install:
    name: "Package install"
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Verify installable
        run: |
          rm -rf .venv
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --upgrade pip
          pip install .

      - name: Verify importable
        run: |
          . .venv/bin/activate
          # Preserve the JSON Schema key for Python; an unescaped $id is a shell variable.
          python3 -c "from minotaur.graph_model.loading import schema; assert schema()['\$id'] == 'urn:minotaur:schemas:minotaur-graph:0.1.0'"
