name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    name: "Test suite"
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          rm -rf .venv
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          . .venv/bin/activate
          python3 -m pytest tests/ -v || test $? -eq 5
