name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.event.pull_request.head.sha || github.sha }}-${{
    (github.event_name == 'workflow_dispatch' ||
    github.event_name == 'merge_group' ||
    (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
    'full' || 'quick' }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python3 -m pip install -e ".[dev]"
      - name: Check lint
        run: ruff check .
      - name: Check format
        run: ruff format --check .
      - name: Check types
        run: mypy

  quick-tests:
    name: Quick tests (${{ matrix.python-version }})
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python3 -m pip install -e ".[dev]"
      - name: Run quick tests
        run: >-
          python3 -m pytest tests/ -v -m "not slow"
          --ignore=tests/test_equivalence_harness.py
          --ignore=tests/test_visualizer_browser.py

  quick-package:
    name: Source package
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install source package
        run: python3 -m pip install .
      - name: Verify installed schema
        run: >-
          python3 -c "from minotaur.graph_model.loading import schema;
          assert schema()['\$id'] == 'urn:minotaur:schemas:minotaur-graph:0.1.0'"

  full-tests:
    name: Full tests (${{ matrix.python-version }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python3 -m pip install -e ".[dev]"
      - name: Run full non-browser suite
        run: >-
          python3 -m pytest tests/ -v
          --ignore=tests/test_visualizer_browser.py

  full-package:
    name: Built wheel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build source archive and wheel
        run: |
          python3 -m pip install "build==1.6.1"
          python3 -m build
      - name: Check built artifacts against the tracked files
        run: |
          python3 - <<'PY'
          import subprocess
          import tarfile
          import zipfile
          from pathlib import Path

          (wheel,) = Path("dist").glob("*.whl")
          (archive,) = Path("dist").glob("*.tar.gz")
          assert len(list(Path("dist").iterdir())) == 2, "unexpected files in dist/"

          tracked = subprocess.run(
              ["git", "ls-files", "src/minotaur"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          assert tracked, "no tracked package files"

          with zipfile.ZipFile(wheel) as zf:
              names = [n for n in zf.namelist() if not n.endswith("/")]
              package = {n for n in names if n.startswith("minotaur/")}
              expected = {"minotaur/" + t.removeprefix("src/minotaur/") for t in tracked}
              assert package == expected, (
                  sorted(package - expected),
                  sorted(expected - package),
              )
              others = {n for n in names if not n.startswith("minotaur/")}
              dist_info = {n.split("/")[0] for n in others}
              assert len(dist_info) == 1, sorted(others)
              (info_dir,) = dist_info
              assert info_dir.endswith(".dist-info"), info_dir
              raw = zf.read(info_dir + "/METADATA")

          head, separator, body = raw.partition(b"\n\n")
          assert separator, "METADATA has no blank line"
          assert "Description-Content-Type: text/markdown" in head.decode("utf-8").splitlines()
          assert body.decode("utf-8") == Path("README.md").read_text(encoding="utf-8")

          with tarfile.open(archive) as tf:
              members = [m.name for m in tf.getmembers()]
          root = archive.name.removesuffix(".tar.gz")
          relative = {m.removeprefix(root + "/") for m in members if m != root}
          for required in ("pyproject.toml", "README.md", "LICENSE", *tracked):
              assert required in relative, required
          forbidden = ("tests", "docs", "examples", "scripts")
          bad = sorted(r for r in relative if r.split("/")[0] in forbidden)
          assert not bad, bad
          PY
      - name: Install wheel and source archive in clean environments
        run: |
          python3 -m venv .package-venv
          .package-venv/bin/python -m pip install dist/*.whl
          python3 -m venv .archive-venv
          .archive-venv/bin/python -m pip install dist/*.tar.gz
      - name: Verify installed CLI, schema, and visualizer assets
        run: |
          for venv in .package-venv .archive-venv; do
            "$venv/bin/minotaur" --help >/dev/null
            "$venv/bin/python" - <<'PY'
          from pathlib import Path

          from minotaur.graph_model.loading import schema
          from minotaur.graph_visualizer.html import render

          assert schema()["$id"] == "urn:minotaur:schemas:minotaur-graph:0.1.0"
          asset_root = Path(render.__file__).parent
          for relative_path in (
              "template.html",
              "viewer.css",
              "viewer.js",
              "vendor/LICENSES.md",
              "vendor/cytoscape-3.34.0.min.js",
              "vendor/cytoscape-dagre-4.0.0.js",
          ):
              assert (asset_root / relative_path).is_file(), relative_path
          PY
          done
      - name: Build at the declared setuptools floor
        run: |
          python3 -m venv .floor-venv
          .floor-venv/bin/python -m pip install "setuptools==77.0.1" "build==1.6.1"
          .floor-venv/bin/python -m build --no-isolation --outdir floor-dist

  browser:
    name: Chromium browser
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # Pinned through the renderer-flake stabilization window so results stay
    # attributable while the Ubuntu 24 → 26 migration rolls out. Removal trigger:
    # return to ubuntu-latest after ~2 weeks of green browser runs plus one
    # observation run on the new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MINOTAUR_VISUALIZER_BROWSER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install visualizer test dependencies
        run: |
          python3 -m pip install -e ".[dev,visualizer]"
          # Pin the browser build under test during the stabilization window.
          python3 -m pip install "playwright==1.63.*"
          python3 -m playwright install --with-deps chromium
      - name: Record browser stack
        run: |
          python3 -m playwright --version
          ls ~/.cache/ms-playwright | grep -i chromium || true
      - name: Exercise generated file artifact
        run: python3 -m pytest tests/test_visualizer_browser.py -v

  gate:
    name: gate
    if: always()
    needs:
      - quality
      - quick-tests
      - quick-package
      - full-tests
      - full-package
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected verification group
        env:
          QUALITY: ${{ needs.quality.result }}
          QUICK_TESTS: ${{ needs.quick-tests.result }}
          QUICK_PACKAGE: ${{ needs.quick-package.result }}
          FULL_TESTS: ${{ needs.full-tests.result }}
          FULL_PACKAGE: ${{ needs.full-package.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$QUALITY" = success
          if test "$QUICK_TESTS" = success && test "$QUICK_PACKAGE" = success; then
            test "$FULL_TESTS" = skipped
            test "$FULL_PACKAGE" = skipped
            test "$BROWSER" = skipped
          else
            test "$QUICK_TESTS" = skipped
            test "$QUICK_PACKAGE" = skipped
            test "$FULL_TESTS" = success
            test "$FULL_PACKAGE" = success
            test "$BROWSER" = success
          fi
